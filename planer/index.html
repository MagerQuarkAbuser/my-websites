<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vanessa & Fabian 🤍</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --emerald: #2D5A27;
            --sage: #87A96B;
            --mint: #D5EDDA;
            --light-blue: #E3F2FD;
            --accent-blue: #90CAF9;
            --cream: #FCFDFB;
            --text: #333;
            --shadow: 0 8px 32px rgba(0,0,0,0.1);
            --glass: rgba(255, 255, 255, 0.7);
            
            /* Neue ToDo Farben */
            --vanessa-bg: #d1f2e8;
            --vanessa-border: #48bb78;
            --fabian-bg: #dbeafe;
            --fabian-border: #4299e1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            color: var(--text);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .bg-blobs {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; overflow: hidden; pointer-events: none;
        }
        .blob {
            position: absolute; width: 400px; height: 400px;
            background: linear-gradient(135deg, var(--mint), var(--light-blue));
            filter: blur(80px); border-radius: 50%; opacity: 0.4;
            animation: float 20s infinite alternate;
        }
        .blob-1 { top: -100px; right: -100px; animation-delay: 0s; }
        .blob-2 { bottom: -100px; left: -100px; background: linear-gradient(135deg, var(--light-blue), var(--accent-blue)); animation-delay: -5s; }

        @keyframes float {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(50px, 100px) scale(1.2); }
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: var(--emerald);
            text-align: center;
            margin: 20px 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .hero-title {
            font-size: clamp(2.8rem, 7vw, 4.5rem);
            margin-top: 40px;
            line-height: 1.2;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 120px;
            position: relative;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.4);
            padding: 25px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--cream);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            font-size: 1rem;
            background: white;
        }

        button {
            background: var(--emerald);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(45, 90, 39, 0.2);
        }

        button:active { transform: scale(0.95); }
        button:hover { opacity: 0.9; }

        .header-tools {
            position: fixed;
            top: 0; left: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 1000;
            pointer-events: none;
        }

        #capybara-corner {
            font-size: 1.8rem;
            cursor: pointer;
            user-select: none;
            pointer-events: auto;
            transition: transform 0.3s;
        }
        #capybara-corner:hover { transform: scale(1.2) rotate(10deg); }

        .profile-btn {
            background: var(--mint);
            color: var(--emerald);
            border-radius: 50%;
            width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: var(--shadow);
        }

        .nav-bar {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 1500;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.7rem;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-item.active { color: var(--emerald); transform: translateY(-5px); }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; }

        .tab-content { display: none; animation: slideUp 0.4s ease-out; }
        .tab-content.active { display: block; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .greeting { text-align: center; font-size: 1.2rem; margin-bottom: 30px; color: #555; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .dash-tile { background: var(--glass); padding: 20px; border-radius: 20px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.5); transition: all 0.3s; }
        .dash-tile:hover { transform: translateY(-5px); background: white; }
        .dash-tile i { font-size: 1.5rem; display: block; margin-bottom: 10px; }

        .list-item { 
            background: white; 
            margin: 10px 0; 
            padding: 16px; 
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.4s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .list-item span { position: relative; cursor: pointer; flex: 1; }
        .list-item span::after {
            content: ''; position: absolute; left: 0; top: 55%; width: 100%; height: 2px;
            background: currentColor; transform: scaleX(0); transform-origin: left;
            transition: transform 0.3s ease-in-out;
        }
        .list-item.done span::after { transform: scaleX(1); }
        .list-item.done { opacity: 0.
