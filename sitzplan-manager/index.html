<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interaktiver Sitzplan & Klassen-Manager</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: { 50: '#eef2ff', 100: '#e0e7ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#312e81' },
                        amber: { 50: '#fffbeb', 200: '#fde68a', 500: '#f59e0b' }
                    }
                }
            }
        }
    </script>

    <!-- Icons & QR Code -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Papier-Muster für den Hintergrund */
        .paper-bg {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Druck-Optimierung */
        @media print {
            body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .seat { border: 2px solid #000 !important; box-shadow: none !important; }
            .seat-disabled { border-style: dashed !important; border-color: #cbd5e1 !important; visibility: hidden; }
        }
        .print-only { display: none; }
        
        /* Touch-Optimierung für Mobilgeräte */
        button, select, input { min-height: 44px; }
        
        /* Animationen */
        @keyframes pulse-amber {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .seat-selected { animation: pulse-amber 1.5s infinite; border-color: #f59e0b !important; background-color: #fffbeb !important; transform: scale(1.05); z-index: 10; }
    </style>
</head>
<body class="paper-bg text-slate-800 antialiased min-h-screen">

    <!-- APP CONTAINER -->
    <div id="app" class="max-w-[1400px] mx-auto p-4 md:p-8"></div>

    <!-- VANILLA JS LOGIK -->
    <script>
        // --- 1. STATE & DATENSTRUKTUR ---
        const STORAGE_KEY = 'sitzplan_data_v1';
        
        let state = {
            className: 'Klasse 10A',
            students: [], // { id, name, hasVoted, wishNeighborId, wishArea }
            rules: [], // { id, type, studentId, targetId }
            seats: [], // { id, x, y, disabled, studentId, area }
            isSwapMode: false,
            swapStartSeatId: null
        };

        // --- 2. INITIALISIERUNG & SPEICHERUNG ---
        function initApp() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                state = { ...state, ...JSON.parse(saved) };
            } else {
                // Generiere Standard 9x5 Raster
                for (let y = 0; y < 5; y++) {
                    for (let x = 0; x < 9; x++) {
                        state.seats.push({
                            id: `s-${x}-${y}`, x, y, disabled: false, studentId: null,
                            area: y < 2 ? 'vorne' : y < 4 ? 'mitte' : 'hinten'
                        });
                    }
                }
                saveState();
            }

            // Routing basierend auf URL
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('student')) {
                renderStudentView();
            } else {
                renderTeacherView();
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                className: state.className,
                students: state.students,
                rules: state.rules,
                seats: state.seats
            }));
            renderTeacherView(); // Re-render nach Speicherung
        }

        // Multi-Tab Sync (ersetzt Firebase für lokale Nutzung)
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) {
                const newData = JSON.parse(e.newValue);
                state.students = newData.students;
                state.rules = newData.rules;
                state.seats = newData.seats;
                state.className = newData.className;
                const urlParams = new URLSearchParams(window.location.search);
                if (!urlParams.has('student')) renderTeacherView();
            }
        });

        // --- 3. UI RENDERING (LEHRER) ---
        function renderTeacherView() {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <!-- HEADER -->
                <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white/90 backdrop-blur p-4 md:p-6 rounded-2xl shadow-sm border-b-4 border-indigo-500 no-print">
                    <div class="flex flex-col gap-2 mb-4 md:mb-0">
                        <h1 class="text-3xl font-black text-indigo-900 flex items-center gap-3">
                            <i class="fa-solid fa-school text-indigo-500"></i> ${state.className}
                        </h1>
                        <button onclick="editClassName()" class="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-full w-fit font-bold transition">
                            <i class="fa-solid fa-pencil"></i> Klassennamen ändern
                        </button>
                    </div>
                    <div class="flex flex-wrap gap-3">
                        <button onclick="openQRModal()" class="bg-amber-400 text-amber-950 px-6 py-3 rounded-xl hover:bg-amber-500 font-extrabold shadow-sm transition">
                            <i class="fa-solid fa-qrcode"></i> Schüler einladen
                        </button>
                        <button onclick="generatePlan()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl hover:bg-indigo-700 font-extrabold shadow-sm transition">
                            <i class="fa-solid fa-play"></i> Plan berechnen
                        </button>
                        <button onclick="window.print()" class="bg-slate-800 text-white px-6 py-3 rounded-xl hover:bg-slate-900 font-extrabold shadow-sm transition">
                            <i class="fa-solid fa-print"></i> PDF / Drucken
                        </button>
                    </div>
                </header>

                <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
                    <!-- SIDEBAR -->
                    <div class="col-span-1 space-y-6 no-print">
                        
                        <!-- SCHÜLER BOX -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border-t-4 border-amber-400">
                            <h2 class="text-xl font-extrabold mb-4 flex items-center gap-2"><i class="fa-solid fa-users text-amber-500"></i> Schüler (${state.students.length})</h2>
                            <div class="flex gap-2 mb-4">
                                <input type="text" id="newStudentName" placeholder="Name eingeben..." class="flex-1 bg-slate-50 border-2 border-slate-200 p-2 rounded-lg font-bold focus:border-amber-400 outline-none" onkeypress="if(event.key === 'Enter') addStudent()">
                                <button onclick="addStudent()" class="bg-amber-400 text-amber-950 w-12 rounded-lg font-black text-xl hover:bg-amber-500 transition">+</button>
                            </div>
                            <ul class="max-h-48 overflow-y-auto space-y-2 pr-1" id="studentList"></ul>
                            ${state.students.length > 0 ? `<button onclick="resetVotes()" class="mt-4 w-full text-sm font-bold text-slate-500 hover:text-red-600 p-2 bg-slate-50 rounded-lg"><i class="fa-solid fa-rotate-left"></i> Wünsche zurücksetzen</button>` : ''}
                        </div>

                        <!-- REGELN BOX -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border-t-4 border-teal-500">
                            <h2 class="text-xl font-extrabold mb-4 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-teal-500"></i> Regeln</h2>
                            <div class="space-y-2 mb-4">
                                <select id="ruleType" class="w-full bg-slate-50 border-2 border-slate-200 p-2 rounded-lg font-bold outline-none focus:border-teal-500" onchange="renderRuleInputs()">
                                    <option value="not_next_to">Darf nicht sitzen neben...</option>
                                    <option value="sit_alone">Muss alleine sitzen</option>
                                    <option value="force_first_row">Muss in die 1. Reihe</option>
                                </select>
                                <div id="ruleInputs" class="space-y-2"></div>
                                <button onclick="addRule()" class="w-full bg-teal-500 hover:bg-teal-600 text-white p-2 rounded-lg font-bold transition">+ Hinzufügen</button>
                            </div>
                            <ul class="space-y-2 max-h-40 overflow-y-auto" id="ruleList"></ul>
                        </div>

                        <!-- MODUS BOX -->
                        <div class="bg-white p-5 rounded-2xl shadow-sm border-t-4 border-indigo-500">
                            <h2 class="text-xl font-extrabold mb-4 flex items-center gap-2"><i class="fa-solid fa-hand-pointer text-indigo-500"></i> Klick-Modus</h2>
                            <div class="flex flex-col gap-2">
                                <button onclick="setSwapMode(false)" class="w-full p-3 rounded-xl font-bold text-left transition ${!state.isSwapMode ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                                    <i class="fa-solid fa-border-all w-5"></i> Layout / Gänge bauen
                                </button>
                                <button onclick="setSwapMode(true)" class="w-full p-3 rounded-xl font-bold text-left transition ${state.isSwapMode ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                                    <i class="fa-solid fa-people-arrows w-5"></i> Schüler umsetzen
                                </button>
                            </div>
                            <p class="text-xs font-bold text-slate-500 mt-3 p-2 bg-slate-50 rounded-lg">
                                ${!state.isSwapMode ? '💡 Klicke auf Plätze, um sie zu deaktivieren.' : state.swapStartSeatId ? '👉 Klicke auf den ZIEL-Platz!' : '💡 Klicke auf einen Schüler zum Tauschen.'}
                            </p>
                        </div>
                    </div>

                    <!-- GRID AREA -->
                    <div class="col-span-1 lg:col-span-3">
                        <div class="bg-white p-6 md:p-10 rounded-3xl shadow-md print:shadow-none border border-slate-100">
                            <h2 class="print-only text-2xl font-black mb-6 text-center border-b-2 border-black pb-2">Sitzplan: ${state.className}</h2>
                            <div class="text-center mb-6 font-bold text-slate-400 tracking-widest uppercase text-sm print:text-black">--- Tafel / Vorne ---</div>
                            <div id="seatingGrid" style="display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 0.5rem;"></div>
                        </div>
                    </div>
                </div>

                <!-- MODAL: QR CODE -->
                <div id="qrModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
                    <div class="bg-white p-8 rounded-3xl text-center shadow-2xl border-4 border-amber-200 max-w-sm w-full">
                        <h2 class="text-2xl font-black mb-4">Schüler-Login</h2>
                        <div id="qrcode" class="flex justify-center mb-6"></div>
                        <input type="text" id="qrLink" readonly class="w-full p-3 bg-slate-50 border rounded-xl text-center font-mono text-sm text-indigo-600 font-bold mb-4">
                        <button onclick="closeQRModal()" class="w-full bg-slate-200 text-slate-800 p-3 rounded-xl font-bold hover:bg-slate-300 transition">Schließen</button>
                    </div>
                </div>
            `;

            populateSidebar();
            renderGrid();
        }

        function populateSidebar() {
            // Students
            const stList = document.getElementById('studentList');
            stList.innerHTML = state.students.map(s => `
                <li class="flex justify-between items-center text-sm border-b border-slate-100 pb-2">
                    <div class="flex flex-col">
                        <span class="font-extrabold text-slate-800">${s.name}</span>
                        <span class="${s.hasVoted ? 'text-green-600' : 'text-amber-500'} font-bold text-[10px] uppercase">${s.hasVoted ? 'Abgestimmt' : 'Fehlt'}</span>
                    </div>
                    <button onclick="deleteStudent('${s.id}')" class="text-slate-400 hover:text-red-500 p-1"><i class="fa-solid fa-trash"></i></button>
                </li>
            `).join('');

            // Rule Inputs (Dynamic Selects)
            renderRuleInputs();

            // Rules List
            const rList = document.getElementById('ruleList');
            rList.innerHTML = state.rules.length === 0 
                ? `<li class="text-xs font-bold text-slate-400 text-center p-2 bg-slate-50 rounded">Keine Regeln aktiv.</li>` 
                : state.rules.map(r => {
                    const s1 = getStudentName(r.studentId);
                    const s2 = r.targetId ? getStudentName(r.targetId) : '';
                    let txt = '';
                    if(r.type === 'not_next_to') txt = `${s1} nicht neben ${s2}`;
                    if(r.type === 'sit_alone') txt = `${s1} sitzt alleine`;
                    if(r.type === 'force_first_row') txt = `${s1} in 1. Reihe`;
                    return `<li class="flex justify-between items-center bg-amber-50 border-l-4 border-amber-400 p-2 rounded text-xs font-bold text-slate-700">
                        ${txt} <button onclick="deleteRule('${r.id}')" class="text-amber-600 hover:text-red-600"><i class="fa-solid fa-xmark"></i></button>
                    </li>`;
                }).join('');
        }

        function renderRuleInputs() {
            const type = document.getElementById('ruleType')?.value || 'not_next_to';
            const container = document.getElementById('ruleInputs');
            if(!container) return;

            let html = `<select id="ruleS1" class="w-full bg-white border border-slate-200 p-2 rounded text-sm font-bold"><option value="">1. Schüler wählen...</option>`;
            state.students.forEach(s => html += `<option value="${s.id}">${s.name}</option>`);
            html += `</select>`;

            if (type === 'not_next_to') {
                html += `<select id="ruleS2" class="w-full bg-white border border-slate-200 p-2 rounded text-sm font-bold mt-2"><option value="">2. Schüler wählen...</option>`;
                state.students.forEach(s => html += `<option value="${s.id}">${s.name}</option>`);
                html += `</select>`;
            }
            container.innerHTML = html;
        }

        function renderGrid() {
            const grid = document.getElementById('seatingGrid');
            if (!grid) return;

            grid.innerHTML = state.seats.map(seat => {
                const isSelected = seat.id === state.swapStartSeatId;
                const isOccupied = !!seat.studentId;
                const sName = getStudentName(seat.studentId);
                
                let classes = "seat h-16 md:h-20 flex flex-col items-center justify-center rounded-xl border-2 transition-all cursor-pointer select-none ";
                
                if (seat.disabled) {
                    classes += "seat-disabled bg-transparent border-dashed border-slate-200 opacity-30 ";
                } else if (isSelected) {
                    classes += "seat-selected ";
                } else if (isOccupied) {
                    classes += "bg-indigo-50 border-indigo-300 shadow-sm ";
                } else {
                    classes += "bg-white border-slate-200 hover:border-indigo-400 shadow-sm ";
                }

                return `
                    <div id="${seat.id}" class="${classes}" onclick="handleSeatClick('${seat.id}')">
                        ${!seat.disabled ? `
                            <span class="text-xs md:text-sm font-black text-slate-800 text-center px-1 break-words w-full overflow-hidden">${sName}</span>
                            <span class="text-[9px] font-medium text-slate-400 mt-1 uppercase no-print">${seat.area}</span>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // --- 4. AKTIONEN & LOGIK ---
        function getStudentName(id) {
            if (!id) return '';
            const s = state.students.find(x => x.id === id);
            return s ? s.name : '';
        }

        function editClassName() {
            const n = prompt('Neuer Klassenname:', state.className);
            if (n && n.trim()) { state.className = n.trim(); saveState(); }
        }

        function addStudent() {
            const input = document.getElementById('newStudentName');
            const name = input.value.trim();
            if (name && state.students.length < 45) {
                state.students.push({ id: 'st-' + Date.now(), name, hasVoted: false, wishNeighborId: null, wishArea: 'egal' });
                input.value = '';
                saveState();
            }
        }

        function deleteStudent(id) {
            if (confirm('Schüler wirklich löschen?')) {
                state.students = state.students.filter(s => s.id !== id);
                state.rules = state.rules.filter(r => r.studentId !== id && r.targetId !== id);
                state.seats.forEach(s => { if (s.studentId === id) s.studentId = null; });
                saveState();
            }
        }

        function addRule() {
            const type = document.getElementById('ruleType').value;
            const s1 = document.getElementById('ruleS1').value;
            const s2 = document.getElementById('ruleS2') ? document.getElementById('ruleS2').value : null;
            
            if (!s1 || (type === 'not_next_to' && (!s2 || s1 === s2))) return;
            
            state.rules.push({ id: 'r-' + Date.now(), type, studentId: s1, targetId: s2 });
            saveState();
        }

        function deleteRule(id) {
            state.rules = state.rules.filter(r => r.id !== id);
            saveState();
        }

        function resetVotes() {
            if (confirm('Alle Wünsche löschen?')) {
                state.students.forEach(s => { s.hasVoted = false; s.wishNeighborId = null; s.wishArea = 'egal'; });
                saveState();
            }
        }

        function setSwapMode(isSwap) {
            state.isSwapMode = isSwap;
            state.swapStartSeatId = null;
            renderTeacherView();
        }

        function handleSeatClick(seatId) {
            const seat = state.seats.find(s => s.id === seatId);
            if (!seat) return;

            if (state.isSwapMode) {
                if (seat.disabled) return; // Ignore aisles during swap
                if (!state.swapStartSeatId) {
                    state.swapStartSeatId = seatId;
                } else {
                    if (state.swapStartSeatId === seatId) {
                        state.swapStartSeatId = null;
                    } else {
                        const startSeat = state.seats.find(s => s.id === state.swapStartSeatId);
                        const tempId = startSeat.studentId;
                        startSeat.studentId = seat.studentId;
                        seat.studentId = tempId;
                        state.swapStartSeatId = null;
                    }
                }
            } else {
                seat.disabled = !seat.disabled;
                seat.studentId = null;
            }
            saveState();
        }

        // --- 5. ALGORITHMUS (Vanilla JS Port) ---
        function generatePlan() {
            const activeSeats = state.seats.filter(s => !s.disabled);
            if (state.students.length > activeSeats.length) {
                return alert('Fehler: Mehr Schüler als aktive Sitzplätze!');
            }

            // 1. Alle Plätze leeren
            state.seats.forEach(s => s.studentId = null);
            
            // 2. Schüler-Pool mischen (Fisher-Yates)
            let unassigned = [...state.students];
            for (let i = unassigned.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [unassigned[i], unassigned[j]] = [unassigned[j], unassigned[i]];
            }

            // Helper: Find seat
            const getSeat = (x, y) => state.seats.find(s => s.x === x && s.y === y && !s.disabled);
            const getNeighbors = (s) => [getSeat(s.x-1, s.y), getSeat(s.x+1, s.y)].filter(Boolean);

            // 3. Reihe 1 Zwang
            const firstRowRules = state.rules.filter(r => r.type === 'force_first_row');
            firstRowRules.forEach(rule => {
                const stIndex = unassigned.findIndex(s => s.id === rule.studentId);
                if (stIndex === -1) return;
                const frontSeats = activeSeats.filter(s => s.y === 0 && !s.studentId);
                if (frontSeats.length > 0) {
                    frontSeats[0].studentId = rule.studentId;
                    unassigned.splice(stIndex, 1);
                }
            });

            // 4. Einzelgänger (sit_alone)
            const aloneRules = state.rules.filter(r => r.type === 'sit_alone');
            aloneRules.forEach(rule => {
                const stIndex = unassigned.findIndex(s => s.id === rule.studentId);
                if (stIndex === -1) return;
                
                // Finde Platz mit leeren Nachbarn
                const emptyIsolatedSeat = activeSeats.find(seat => {
                    if (seat.studentId) return false;
                    const neighbors = getNeighbors(seat);
                    return neighbors.every(n => !n.studentId);
                });

                if (emptyIsolatedSeat) {
                    emptyIsolatedSeat.studentId = rule.studentId;
                    unassigned.splice(stIndex, 1);
                }
            });

            // 5. Restliche Schüler verteilen + Wünsche/Feinde prüfen
            unassigned.forEach(student => {
                const enemies = state.rules.filter(r => r.type === 'not_next_to' && (r.studentId === student.id || r.targetId === student.id))
                                           .map(r => r.studentId === student.id ? r.targetId : r.studentId);
                
                let bestSeat = null;
                
                // Priorisiere Wunschbereich, falls vorhanden
                let available = activeSeats.filter(s => !s.studentId);
                if (student.wishArea && student.wishArea !== 'egal') {
                    const areaMatch = available.filter(s => s.area === student.wishArea);
                    if (areaMatch.length > 0) available = areaMatch;
                }

                // Versuche Feinde zu meiden
                for (let seat of available) {
                    const neighbors = getNeighbors(seat);
                    const hasEnemy = neighbors.some(n => enemies.includes(n.studentId));
                    if (!hasEnemy) {
                        bestSeat = seat;
                        break;
                    }
                }

                // Fallback, falls unmöglich
                if (!bestSeat) bestSeat = activeSeats.find(s => !s.studentId);
                
                if (bestSeat) bestSeat.studentId = student.id;
            });

            saveState();
        }

        // --- 6. QR CODE & SCHÜLER ANSICHT (Routing) ---
        function openQRModal() {
            document.getElementById('qrModal').classList.remove('hidden');
            const link = window.location.href.split('?')[0] + '?student=1';
            document.getElementById('qrLink').value = link;
            
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: link,
                width: 200, height: 200,
                colorDark: "#312e81", colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        // SCHÜLER-ANSICHT RENDERER
        function renderStudentView() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl mt-12 border-t-8 border-indigo-600">
                    <h1 class="text-3xl font-black text-center mb-8 text-indigo-900">Sitzplatz-Wünsche</h1>
                    
                    <div id="studentForm" class="space-y-6">
                        <div>
                            <label class="block font-bold text-slate-700 mb-2">Wer bist du?</label>
                            <select id="studentSelect" onchange="checkStudentStatus()" class="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl font-bold outline-none focus:border-indigo-500">
                                <option value="">Bitte wählen...</option>
                                ${state.students.map(s => `<option value="${s.id}" ${s.hasVoted ? 'disabled' : ''}>${s.name} ${s.hasVoted ? '(Schon abgestimmt)' : ''}</option>`).join('')}
                            </select>
                        </div>

                        <div id="wishContainer" class="hidden space-y-6">
                            <div class="p-5 bg-indigo-50 rounded-2xl border border-indigo-100">
                                <label class="block font-bold text-indigo-900 mb-2">Wunsch-Nachbar <span class="text-indigo-600 text-sm">(optional)</span></label>
                                <select id="neighborSelect" class="w-full p-3 bg-white border border-indigo-200 rounded-lg font-bold outline-none focus:border-indigo-500"></select>
                            </div>

                            <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200">
                                <label class="block font-bold text-slate-800 mb-3">Sitzbereich</label>
                                <div class="grid grid-cols-2 gap-3" id="areaBtns">
                                    ${['vorne', 'mitte', 'hinten', 'egal'].map(a => `
                                        <button type="button" onclick="selectArea('${a}')" id="btn-${a}" class="py-3 rounded-lg border-2 font-bold capitalize transition bg-white border-slate-200 text-slate-700 hover:bg-slate-100">${a}</button>
                                    `).join('')}
                                </div>
                            </div>
                            
                            <button onclick="submitStudentVote()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-lg rounded-xl shadow-lg transition">Wünsche absenden</button>
                        </div>
                    </div>
                    
                    <div id="successMsg" class="hidden text-center py-8">
                        <div class="text-5xl mb-4">🎉</div>
                        <h2 class="text-2xl font-black text-green-600 mb-2">Gespeichert!</h2>
                        <p class="font-bold text-slate-600">Du kannst dieses Fenster jetzt schließen.</p>
                    </div>
                </div>
            `;
            // Standardmäßig 'egal' wählen
            setTimeout(() => selectArea('egal'), 50);
        }

        let selectedArea = 'egal';
        function selectArea(area) {
            selectedArea = area;
            ['vorne', 'mitte', 'hinten', 'egal'].forEach(a => {
                const btn = document.getElementById(`btn-${a}`);
                if (!btn) return;
                if (a === area) {
                    btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
                    btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-200');
                } else {
                    btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
                    btn.classList.add('bg-white', 'text-slate-700', 'border-slate-200');
                }
            });
        }

        function checkStudentStatus() {
            const sid = document.getElementById('studentSelect').value;
            const container = document.getElementById('wishContainer');
            const ns = document.getElementById('neighborSelect');
            
            if (!sid) {
                container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');
            
            ns.innerHTML = `<option value="">Kein spezieller Wunsch</option>` + 
                state.students.filter(s => s.id !== sid).map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        }

        function submitStudentVote() {
            const sid = document.getElementById('studentSelect').value;
            const nid = document.getElementById('neighborSelect').value;
            
            if (!sid) return;
            
            const sIndex = state.students.findIndex(s => s.id === sid);
            if (sIndex > -1) {
                state.students[sIndex].hasVoted = true;
                state.students[sIndex].wishNeighborId = nid || null;
                state.students[sIndex].wishArea = selectedArea;
                
                saveState();
                
                document.getElementById('studentForm').classList.add('hidden');
                document.getElementById('successMsg').classList.remove('hidden');
            }
        }

        // Start
        window.onload = initApp;
    </script>
</body>
</html>
