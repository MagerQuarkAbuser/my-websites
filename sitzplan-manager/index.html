<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitzplan Generator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #7c3aed;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; margin-top: 20px; }
        .seat { aspect-ratio: 1; border: 2px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 0.8rem; text-align: center; }
        .seat.active { background: var(--primary); color: white; border-color: var(--primary); }
        .seat.disabled { background: #f1f5f9; cursor: not-allowed; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        .hidden { display: none; }
        @media print { .no-print { display: none; } body { background: white; } }
    </style>
</head>
<body>

<div id="app" class="container">
    <div id="teacher-view">
        <h1>Sitzplan Generator</h1>
        <div class="card">
            <h3>Schülerverwaltung</h3>
            <input type="text" id="studentName" placeholder="Name eingeben">
            <button onclick="addStudent()">Hinzufügen</button>
            <ul id="studentList"></ul>
        </div>
        <div class="card">
            <div class="no-print">
                <button onclick="setMode('layout')">Layout bearbeiten</button>
                <button onclick="setMode('move')">Manuell umsetzen</button>
                <button onclick="generatePlan()">Automatisch generieren</button>
            </div>
            <div id="seatingGrid" class="grid"></div>
        </div>
    </div>

    <div id="student-view" class="hidden">
        <h1>Sitzplatzwahl</h1>
        <div id="studentGrid" class="grid"></div>
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('sitzplanData')) || {
        students: [],
        layout: Array(45).fill(true),
        mode: 'layout',
        assignments: {}
    };

    function save() {
        localStorage.setItem('sitzplanData', JSON.stringify(state));
        render();
    }

    function addStudent() {
        const name = document.getElementById('studentName').value;
        if(name) {
            state.students.push({id: Date.now(), name});
            save();
        }
    }

    function setMode(m) { state.mode = m; render(); }

    function toggleSeat(idx) {
        if(state.mode === 'layout') {
            state.layout[idx] = !state.layout[idx];
            save();
        }
    }

    function render() {
        const grid = document.getElementById('seatingGrid');
        grid.innerHTML = '';
        state.layout.forEach((active, i) => {
            const div = document.createElement('div');
            div.className = `seat ${active ? 'active' : 'disabled'}`;
            div.innerText = i + 1;
            div.onclick = () => toggleSeat(i);
            grid.appendChild(div);
        });

        const list = document.getElementById('studentList');
        list.innerHTML = state.students.map(s => `<li>${s.name}</li>`).join('');
    }

    function generatePlan() {
        let activeIndices = state.layout.map((active, i) => active ? i : -1).filter(i => i !== -1);
        state.assignments = {};
        state.students.forEach((s, i) => {
            if(activeIndices[i] !== undefined) state.assignments[s.id] = activeIndices[i];
        });
        save();
    }

    window.addEventListener('storage', () => {
        state = JSON.parse(localStorage.getItem('sitzplanData'));
        render();
    });

    // URL Param Check
    if(new URLSearchParams(window.location.search).has('student')) {
        document.getElementById('teacher-view').classList.add('hidden');
        document.getElementById('student-view').classList.remove('hidden');
    }

    render();
</script>
</body>
</html>
