<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live-Abstimmung</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        indigo: {
                            950: '#1e1b4b',
                            900: '#312e81',
                            600: '#4f46e5',
                            500: '#6366f1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .no-select { user-select: none; -webkit-user-select: none; }
        /* Touch-Optimierung für sauberes Feedback */
        button:active { transform: scale(0.98); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-6 font-sans">

    <header class="w-full max-w-2xl text-center mb-8 mt-4 relative">
        <h1 id="app-title" class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400 cursor-pointer no-select inline-block pb-2">
            Live-Abstimmung
        </h1>
        <p class="text-slate-400 mt-2">Wähle deine bevorzugte Option.</p>
    </header>

    <!-- Verstecktes Lehrer-Panel -->
    <div id="teacher-panel" class="hidden w-full max-w-2xl bg-indigo-950 border border-indigo-500/30 rounded-2xl p-4 mb-8 flex justify-between items-center shadow-lg shadow-indigo-900/20">
        <div>
            <h2 class="text-lg font-bold text-indigo-300">Lehrer-Dashboard</h2>
            <p class="text-sm text-slate-400">Aktuelle Version: <span id="version-display">1</span></p>
        </div>
        <button id="btn-reset" class="bg-red-500/10 text-red-400 border border-red-500/50 hover:bg-red-500 hover:text-white px-4 py-3 rounded-xl font-medium transition-colors min-h-[44px]">
            Umfrage Resetten
        </button>
    </div>

    <main class="w-full max-w-2xl bg-slate-800 rounded-3xl shadow-xl border border-slate-700 p-6 md:p-8 relative overflow-hidden">
        
        <!-- Ansicht 1: Abstimmung -->
        <div id="view-vote" class="flex flex-col gap-4">
            <button class="vote-btn bg-slate-700 hover:bg-indigo-600 text-white p-4 rounded-2xl text-lg font-medium transition-all min-h-[60px] text-left pl-6 flex items-center justify-between group" data-option="A">
                <span>Option A</span>
                <span class="opacity-0 group-hover:opacity-100 transition-opacity text-indigo-200">Wählen →</span>
            </button>
            <button class="vote-btn bg-slate-700 hover:bg-indigo-600 text-white p-4 rounded-2xl text-lg font-medium transition-all min-h-[60px] text-left pl-6 flex items-center justify-between group" data-option="B">
                <span>Option B</span>
                <span class="opacity-0 group-hover:opacity-100 transition-opacity text-indigo-200">Wählen →</span>
            </button>
            <button class="vote-btn bg-slate-700 hover:bg-indigo-600 text-white p-4 rounded-2xl text-lg font-medium transition-all min-h-[60px] text-left pl-6 flex items-center justify-between group" data-option="C">
                <span>Option C</span>
                <span class="opacity-0 group-hover:opacity-100 transition-opacity text-indigo-200">Wählen →</span>
            </button>
            <button class="vote-btn bg-slate-700 hover:bg-indigo-600 text-white p-4 rounded-2xl text-lg font-medium transition-all min-h-[60px] text-left pl-6 flex items-center justify-between group" data-option="D">
                <span>Option D</span>
                <span class="opacity-0 group-hover:opacity-100 transition-opacity text-indigo-200">Wählen →</span>
            </button>
        </div>

        <!-- Ansicht 2: Ergebnisse -->
        <div id="view-results" class="hidden flex-col items-center w-full">
            <h3 class="text-xl font-semibold mb-6 text-center text-indigo-300">Aktueller Zwischenstand</h3>
            <div class="w-full relative h-64 md:h-80">
                <canvas id="resultsChart"></canvas>
            </div>
            <p class="text-slate-400 text-sm mt-6 text-center">Du hast bereits abgestimmt. Warte auf den Reset für eine neue Runde.</p>
        </div>

    </main>

    <script type="module">
        // 1. FIREBASE CONFIGURATION (Bitte mit deinen Daten ausfüllen)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getDatabase, ref, onValue, runTransaction, set } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "DEINE_API_KEY",
            authDomain: "DEIN_PROJEKT.firebaseapp.com",
            databaseURL: "https://DEIN_PROJEKT-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "DEIN_PROJEKT",
            storageBucket: "DEIN_PROJEKT.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        // Firebase Initialisierung
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pollRef = ref(db, 'currentPoll');

        // 2. STATE MANAGEMENT
        let currentPollVersion = 0;
        let localVoteVersion = localStorage.getItem('votedVersion') || 0;
        let chartInstance = null;

        const viewVote = document.getElementById('view-vote');
        const viewResults = document.getElementById('view-results');
        const versionDisplay = document.getElementById('version-display');

        // 3. CHART.JS SETUP
        const ctx = document.getElementById('resultsChart').getContext('2d');
        const initChart = (data) => {
            if (chartInstance) chartInstance.destroy();
            
            Chart.defaults.color = '#94a3b8';
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Option A', 'Option B', 'Option C', 'Option D'],
                    datasets: [{
                        label: 'Stimmen',
                        data: [data.A || 0, data.B || 0, data.C || 0, data.D || 0],
                        backgroundColor: '#6366f1',
                        borderRadius: 8,
                        barThickness: 'flex',
                        maxBarThickness: 50
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            ticks: { stepSize: 1, precision: 0 },
                            grid: { color: '#334155' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        };

        // 4. FIREBASE REALTIME LISTENER
        onValue(pollRef, (snapshot) => {
            const data = snapshot.val() || { version: 1, votes: { A: 0, B: 0, C: 0, D: 0 } };
            currentPollVersion = data.version;
            versionDisplay.innerText = currentPollVersion;

            // Chart updaten falls existent
            if (chartInstance) {
                chartInstance.data.datasets[0].data = [data.votes.A, data.votes.B, data.votes.C, data.votes.D];
                chartInstance.update();
            } else {
                initChart(data.votes);
            }

            // UI Logik: Version prüfen
            localVoteVersion = localStorage.getItem('votedVersion') || 0;
            if (parseInt(localVoteVersion) !== currentPollVersion) {
                // Neuer Poll aktiv - zeige Buttons
                viewVote.classList.remove('hidden');
                viewVote.classList.add('flex');
                viewResults.classList.add('hidden');
                viewResults.classList.remove('flex');
            } else {
                // Bereits für diese Version abgestimmt - zeige Grafik
                viewVote.classList.add('hidden');
                viewVote.classList.remove('flex');
                viewResults.classList.remove('hidden');
                viewResults.classList.add('flex');
            }
        });

        // 5. VOTING LOGIK
        document.querySelectorAll('.vote-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const option = e.currentTarget.getAttribute('data-option');
                
                // Lokal sofort sperren
                localStorage.setItem('votedVersion', currentPollVersion);
                viewVote.classList.add('hidden');
                viewVote.classList.remove('flex');
                viewResults.classList.remove('hidden');
                viewResults.classList.add('flex');

                // In Firebase hochzählen
                const voteRef = ref(db, `currentPoll/votes/${option}`);
                runTransaction(voteRef, (currentVotes) => {
                    return (currentVotes || 0) + 1;
                });
            });
        });

        // 6. EASTER EGG (LEHRER-ANSICHT)
        let tapCount = 0;
        let tapTimer;
        document.getElementById('app-title').addEventListener('click', () => {
            tapCount++;
            clearTimeout(tapTimer);
            
            if (tapCount >= 5) {
                document.getElementById('teacher-panel').classList.toggle('hidden');
                tapCount = 0;
            }
            
            tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
        });

        // 7. RESET LOGIK (LEHRER)
        document.getElementById('btn-reset').addEventListener('click', () => {
            const nextVersion = currentPollVersion + 1;
            set(pollRef, {
                version: nextVersion,
                votes: { A: 0, B: 0, C: 0, D: 0 }
            });
            // Button visuelles Feedback
            const btn = document.getElementById('btn-reset');
            const oldText = btn.innerText;
            btn.innerText = "Zurückgesetzt!";
            btn.classList.replace('text-red-400', 'text-green-400');
            setTimeout(() => {
                btn.innerText = oldText;
                btn.classList.replace('text-green-400', 'text-red-400');
            }, 2000);
        });
    </script>
</body>
</html>
