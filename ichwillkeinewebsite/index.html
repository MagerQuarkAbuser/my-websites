<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ich will keine Website</title>
    <style>
        :root {
            --bg-color: #121212;
            --lavender: #E6E6FA;
            --butter: #FFFACD;
            --baby-blue: #89CFF0;
            --text-color: #f0f0f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            position: absolute;
            top: 20px;
            font-size: 1.5rem;
            color: var(--lavender);
            letter-spacing: 2px;
            opacity: 0.5;
            text-transform: uppercase;
        }

        #mainButton {
            position: absolute;
            padding: 20px 40px;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--butter);
            color: #333;
            border: 6px solid var(--baby-blue);
            border-radius: 15px;
            box-shadow: 0 10px 0 var(--lavender), 0 15px 20px rgba(0,0,0,0.5);
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            white-space: nowrap;
            z-index: 1000;
        }

        #mainButton:active {
            box-shadow: 0 5px 0 var(--lavender), 0 8px 10px rgba(0,0,0,0.5);
            transform: translateY(5px);
        }

        .background-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
        }
    </style>
</head>
<body>

    <h1>Ich will keine Website</h1>

    <div class="background-decoration">
        <div class="circle" style="width: 400px; height: 400px; background: var(--lavender); top: -100px; left: -100px;"></div>
        <div class="circle" style="width: 300px; height: 300px; background: var(--baby-blue); bottom: -50px; right: -50px;"></div>
        <div class="circle" style="width: 250px; height: 250px; background: var(--butter); top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>
    </div>

    <button id="mainButton">KEINE AHNUNG</button>

    <script>
        const btn = document.getElementById('mainButton');
        let currentScale = 1;
        
        // Audio Context für den "dummen" Sound
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playDumbSound() {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            // Ein lustiger "Boing" oder "Slide" Effekt
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }

        function moveButton() {
            // Sound abspielen
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            playDumbSound();

            // Größe erhöhen
            currentScale += 0.15;
            
            // Neue Position berechnen
            const padding = 50;
            const btnWidth = btn.offsetWidth * currentScale;
            const btnHeight = btn.offsetHeight * currentScale;
            
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;
            
            // Sicherstellen, dass die Werte nicht negativ sind
            const randomX = Math.max(padding, Math.random() * maxX);
            const randomY = Math.max(padding, Math.random() * maxY);

            // Styles anwenden
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
            btn.style.transform = `scale(${currentScale})`;
            
            // Zufällige Farbe aus dem Schema beim Klick
            const colors = ['#E6E6FA', '#FFFACD', '#89CFF0'];
            btn.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        }

        // Initiale Positionierung in der Mitte
        function centerButton() {
            const x = (window.innerWidth - btn.offsetWidth) / 2;
            const y = (window.innerHeight - btn.offsetHeight) / 2;
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        window.onload = centerButton;
        window.onresize = centerButton;

        btn.addEventListener('click', moveButton);
    </script>
</body>
</html>
