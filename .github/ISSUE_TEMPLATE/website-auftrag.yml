name: "Website-Auftrag"
description: "Erstelle oder aktualisiere eine Website per Google Gemini"
title: "[Website]: "
labels: ["website-generator"]
body:
  - type: input
    id: project_name
    attributes:
      label: "Projektname"
      description: "URL-tauglicher Ordnername (nur Kleinbuchstaben, Zahlen, Bindestriche, z. B. taschenrechner)"
      placeholder: "taschenrechner"
    validations:
      required: true

  - type: input
    id: page_title
    attributes:
      label: "Seitentitel / Vorschau-Überschrift"
      description: "Der sichtbare Titel auf der Website"
      placeholder: "Mein minimalistischer Taschenrechner"
    validations:
      required: true

  - type: dropdown
    id: action_type
    attributes:
      label: "Aktion"
      options:
        - "Neues Projekt erstellen"
        - "Bestehendes Projekt aktualisieren"
    validations:
      required: true

  - type: dropdown
    id: display_mode
    attributes:
      label: "Basis-Modus"
      description: "Wähle das grundlegende Erscheinungsbild"
      options:
        - "Dark Mode"
        - "Light Mode"
    validations:
      required: true

  - type: dropdown
    id: color_palette
    attributes:
      label: "Farbpalette / Akzent-Stil"
      description: "Wähle eines der 10 Farbschemata für Akzente, Buttons und Verläufe"
      options:
        - "1. Minimalistisch Monochrom (Schwarz, Weiß & neutrale Grautöne)"
        - "2. Modern Tech Indigo (Royalblau, Violett & saubere Akzente)"
        - "3. Cyberpunk Neon (Leuchtendes Pink, Türkis & Cyber-Cyan)"
        - "4. Nordic Ice (Kühles Schiefergrau, Eisblau & Polarweiß)"
        - "5. Smaragd & Natur (Edles Waldgrün, Salbei & Minz-Akzente)"
        - "6. Sunset Glow (Warme Verläufe aus Koralle, Pfirsich & Amber)"
        - "7. Midnight Navy (Tiefes Nachtblau, Indigo & Silber-Details)"
        - "8. Retro Synthwave (80er-Jahre Lila, Neon-Magenta & Dunkelviolett)"
        - "9. Warme Erde & Terracotta (Sanftes Sandbeige, Warmbraun & Ziegelrot)"
        - "10. Pastell Dream (Sanfte Töne wie Lavendel, Buttergelb & Babyblau)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Detaillierte Wünsche & Funktionen"
      description: "Was soll die Seite konkret können? Welche Berechnungen, Buttons, Features oder Inhalte werden benötigt?"
      placeholder: "Beschreibe die Logik und das Aussehen so detailliert wie möglich..."
    validations:
      required: true
