name: "Multi-Site Generator"

on:
  issues:
    types: [opened]

jobs:
  generate-website:
    if: startsWith(github.event.issue.title, '[Website]:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gemini Code generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - << 'EOF'
          import os
          import re
          import json
          import urllib.request
          import urllib.error

          raw_api_key = os.environ.get("GEMINI_API_KEY", "")
          api_key = raw_api_key.strip()
          body = os.environ.get("ISSUE_BODY", "")

          if not api_key:
              print("FEHLER: Kein GEMINI_API_KEY als Secret hinterlegt.")
              exit(1)

          def extract_field(label, text):
              pattern = rf"###\s+{re.escape(label)}\s*\n\n([\s\S]*?)(?=\n###|\Z)"
              match = re.search(pattern, text)
              return match.group(1).strip() if match else ""

          raw_project_name = extract_field("Projektname", body)
          page_title = extract_field("Seitentitel / Vorschau-Überschrift", body)
          action_type = extract_field("Aktion", body)
          site_type = extract_field("Art der Website", body)
          color_scheme = extract_field("Farbschema", body)
          description = extract_field("Detaillierte Wünsche & Funktionen", body)

          clean_name = re.sub(r'[^a-z0-9_-]', '', raw_project_name.lower())
          if not clean_name:
              clean_name = "website-projekt"

          file_path = os.path.join(clean_name, "index.html")
          existing_code = ""

          if "aktualisieren" in action_type.lower() and os.path.exists(file_path):
              with open(file_path, "r", encoding="utf-8") as f:
                  existing_code = f.read()

          # 1. Verfügbare Modelle dynamisch von Google abfragen
          models_url = f"https://generativelanguage.googleapis.com/v1beta/models?key={api_key}"
          try:
              req_models = urllib.request.Request(models_url)
              with urllib.request.urlopen(req_models) as resp:
                  models_data = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"API Fehler beim Abrufen der Modell-Liste ({e.code}): {e.read().decode('utf-8')}")
              exit(1)

          available_models = [
              m["name"] for m in models_data.get("models", [])
              if "generateContent" in m.get("supportedGenerationMethods", [])
          ]

          # Bevorzuge Pro-Modelle (stärkste Code-Qualität)
          selected_model = None
          preferred_pro = [
              "gemini-1.5-pro-latest",
              "gemini-1.5-pro-002",
              "gemini-1.5-pro-001",
              "gemini-1.5-pro",
              "gemini-pro"
          ]

          for pref in preferred_pro:
              match = [m for m in available_models if m.endswith(pref)]
              if match:
                  selected_model = match[0]
                  break

          if not selected_model:
              pro_candidates = [m for m in available_models if "pro" in m.lower()]
              if pro_candidates:
                  selected_model = pro_candidates[0]

          if not selected_model:
              flash_candidates = [m for m in available_models if "flash" in m.lower()]
              if flash_candidates:
                  selected_model = flash_candidates[0]

          if not selected_model and available_models:
              selected_model = available_models[0]

          if not selected_model:
              print("FEHLER: Kein passendes Modell für generateContent gefunden.")
              exit(1)

          print(f"--> Verwende Modell: {selected_model}")

          system_prompt = (
              "Du bist ein professioneller Web-Entwickler. Erstelle eine vollständige, "
              "moderne, responsive Single-File-Website (HTML5 mit integriertem <style> und <script>). "
              "Verwende keine externen Frameworks, sondern sauberes Vanilla-HTML, CSS und JavaScript. "
              "Gib AUSSCHLIESSLICH den rohen HTML-Code zurück. Keine Markdown-Backticks, keine Erklärungen davor oder danach."
          )

          user_prompt = f"""
          PROJEKT-DATEN:
          - Titel: {page_title}
          - Typ: {site_type}
          - Farbschema: {color_scheme}
          - Anforderungen: {description}
          """

          if existing_code:
              user_prompt += f"""
          - AKTION: Aktualisiere den bestehenden Code zielgerichtet anhand der Anforderungen.
          - BESTEHENDER CODE:
          {existing_code}
          """
          else:
              user_prompt += "\n- AKTION: Erstelle ein komplett neues Projekt von Grund auf."

          payload = {
              "systemInstruction": {
                  "parts": [{"text": system_prompt}]
              },
              "contents": [{
                  "role": "user",
                  "parts": [{"text": user_prompt}]
              }],
              "generationConfig": {
                  "temperature": 0.3
              }
          }

          if not selected_model.startswith("models/"):
              selected_model = f"models/{selected_model}"

          url = f"https://generativelanguage.googleapis.com/v1beta/{selected_model}:generateContent?key={api_key}"
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          try:
              with urllib.request.urlopen(req) as response:
                  res_data = json.loads(response.read().decode("utf-8"))
                  generated_html = res_data["candidates"][0]["content"]["parts"][0]["text"]
          except urllib.error.HTTPError as e:
              error_details = e.read().decode("utf-8")
              print(f"API Fehler ({e.code}): {error_details}")
              exit(1)
          except Exception as e:
              print(f"Allgemeiner Fehler: {e}")
              exit(1)

          cleaned_html = re.sub(r"^```(?:html)?\s*", "", generated_html.strip(), flags=re.MULTILINE)
          cleaned_html = re.sub(r"```\s*$", "", cleaned_html, flags=re.MULTILINE).strip()

          os.makedirs(clean_name, exist_ok=True)
          with open(file_path, "w", encoding="utf-8") as f:
              f.write(cleaned_html)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"PROJECT_FOLDER={clean_name}\n")
              env_file.write(f"PAGE_TITLE={page_title}\n")
          EOF

      - name: Änderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy: Website '${{ env.PAGE_TITLE }}' in /${{ env.PROJECT_FOLDER }}/" || echo "Keine Änderungen vorhanden."
          git push

      - name: Issue kommentieren und schließen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          LIVE_URL="https://${OWNER}.github.io/${REPO}/${PROJECT_FOLDER}/"
          COMMENT="### Website erfolgreich bereitgestellt! 🎉\n\n- **Projekt:** \`${PROJECT_FOLDER}\`\n- **Live-URL:** [${LIVE_URL}](${LIVE_URL})\n\n*(Hinweis: GitHub Pages benötigt beim allerersten Aufruf ca. 1 bis 2 Minuten für die Bereitstellung.)*"
          
          gh issue comment "$ISSUE_NUMBER" --body "$COMMENT"
          gh issue close "$ISSUE_NUMBER"
