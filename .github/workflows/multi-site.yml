name: "Multi-Site Generator"

on:
  issues:
    types: [opened]

jobs:
  generate-website:
    if: startsWith(github.event.issue.title, '[Website]:') || startsWith(github.event.issue.title, '[Update]:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gemini Code generieren
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - << 'EOF'
          import os
          import re
          import json
          import urllib.request
          import urllib.error

          raw_api_key = os.environ.get("GEMINI_API_KEY", "")
          api_key = raw_api_key.strip()
          body = os.environ.get("ISSUE_BODY", "")
          title = os.environ.get("ISSUE_TITLE", "")

          if not api_key:
              print("FEHLER: Kein GEMINI_API_KEY als Secret hinterlegt.")
              exit(1)

          def extract_field(label, text):
              pattern = rf"###\s+{re.escape(label)}\s*\n\n([\s\S]*?)(?=\n###|\Z)"
              match = re.search(pattern, text)
              return match.group(1).strip() if match else ""

          raw_project_name = extract_field("Projektname", body)
          clean_name = re.sub(r'[^a-z0-9_-]', '', raw_project_name.lower())
          if not clean_name:
              clean_name = "website-projekt"

          file_path = os.path.join(clean_name, "index.html")
          is_update = title.startswith("[Update]:")

          existing_code = ""
          if is_update:
              if not os.path.exists(file_path):
                  print(f"FEHLER: Das Projekt '{clean_name}' existiert noch nicht. Bitte erstelle es zuerst.")
                  exit(1)
              with open(file_path, "r", encoding="utf-8") as f:
                  existing_code = f.read()
              
              update_requests = extract_field("Gewünschte Änderungen", body)
              system_prompt = (
                  "Du bist ein professioneller Web-Entwickler. Du bearbeitest den bestehenden Code einer Single-File-Website. "
                  "WICHTIGSTE REGEL: Behalte das bisherige Farbschema, das Layout, alle Schriften und alle bestehenden Funktionen "
                  "vollständig und unverändert bei, es sei denn der Nutzer fordert ausdrücklich eine optische Änderung! "
                  "Integriere die neuen Wünsche nahtlos in den bestehenden HTML-, CSS- und JavaScript-Code. "
                  "Gib AUSSCHLIESSLICH den vollständigen neuen HTML-Code zurück. Keine Markdown-Backticks, keine Erklärungen."
              )
              user_prompt = f"""
              BESTEHENDER CODE:
              {existing_code}

              GEWÜNSCHTE ÄNDERUNGEN:
              {update_requests}
              """
              page_title = clean_name
          else:
              page_title = extract_field("Seitentitel / Vorschau-Überschrift", body)
              display_mode = extract_field("Basis-Modus", body)
              color_palette = extract_field("Farbpalette / Akzent-Stil", body)
              description = extract_field("Detaillierte Wünsche & Funktionen", body)

              system_prompt = (
                  "Du bist ein professioneller Web-Entwickler. Erstelle eine vollständige, "
                  "moderne, responsive Single-File-Website (HTML5 mit integriertem <style> und <script>). "
                  "Verwende keine externen Frameworks, sondern sauberes Vanilla-HTML, CSS und JavaScript. "
                  "Gib AUSSCHLIESSLICH den rohen HTML-Code zurück. Keine Markdown-Backticks, keine Erklärungen davor oder danach."
              )
              user_prompt = f"""
              PROJEKT-DATEN:
              - Titel: {page_title}
              - Basis-Modus: {display_mode}
              - Gewähltes Farbschema: {color_palette}
              - Anforderungen: {description}
              """

          # Modelle dynamisch ermitteln
          models_url = f"https://generativelanguage.googleapis.com/v1beta/models?key={api_key}"
          try:
              req_models = urllib.request.Request(models_url)
              with urllib.request.urlopen(req_models) as resp:
                  models_data = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as e:
              print(f"Fehler beim Laden der Google-Modelle ({e.code}): {e.read().decode('utf-8')}")
              exit(1)

          available_models = [
              m["name"] for m in models_data.get("models", [])
              if "generateContent" in m.get("supportedGenerationMethods", [])
          ]

          def model_priority(name):
              score = 0
              if "3" in name: score += 100
              elif "2" in name: score += 50
              if "pro" in name: score += 20
              elif "flash" in name: score += 10
              return score

          sorted_models = sorted(available_models, key=model_priority, reverse=True)

          payload = {
              "systemInstruction": {
                  "parts": [{"text": system_prompt}]
              },
              "contents": [{
                  "role": "user",
                  "parts": [{"text": user_prompt}]
              }],
              "generationConfig": {
                  "temperature": 0.3
              }
          }

          generated_html = None
          for model_name in sorted_models:
              print(f"Sende Anfrage an: {model_name}...")
              url = f"https://generativelanguage.googleapis.com/v1beta/{model_name}:generateContent?key={api_key}"
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"}
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      res_data = json.loads(response.read().decode("utf-8"))
                      generated_html = res_data["candidates"][0]["content"]["parts"][0]["text"]
                      print(f"Erfolg mit: {model_name}")
                      break
              except urllib.error.HTTPError as e:
                  print(f"-> Modell {model_name} meldet {e.code}, probiere nächstes...")
                  continue
              except Exception as e:
                  print(f"-> Fehler: {e}")
                  continue

          if not generated_html:
              print("FEHLER: Website konnte nicht generiert werden.")
              exit(1)

          cleaned_html = re.sub(r"^```(?:html)?\s*", "", generated_html.strip(), flags=re.MULTILINE)
          cleaned_html = re.sub(r"```\s*$", "", cleaned_html, flags=re.MULTILINE).strip()

          os.makedirs(clean_name, exist_ok=True)
          with open(file_path, "w", encoding="utf-8") as f:
              f.write(cleaned_html)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"PROJECT_FOLDER={clean_name}\n")
              env_file.write(f"IS_UPDATE={'true' if is_update else 'false'}\n")
          EOF

      - name: Änderungen committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy: Update für /${{ env.PROJECT_FOLDER }}/" || echo "Keine Änderungen vorhanden."
          git push

      - name: Issue kommentieren und schließen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          LIVE_URL="https://${OWNER}.github.io/${REPO}/${PROJECT_FOLDER}/"
          
          if [ "${IS_UPDATE}" = "true" ]; then
            COMMENT="### Update erfolgreich aufgespielt! 🚀\n\nDie Änderungen für **\`${PROJECT_FOLDER}\`** sind live:\n👉 [${LIVE_URL}](${LIVE_URL})"
          else
            COMMENT="### Website erfolgreich bereitgestellt! 🎉\n\n- **Projekt:** \`${PROJECT_FOLDER}\`\n- **Live-URL:** [${LIVE_URL}](${LIVE_URL})\n\n*(Hinweis: GitHub Pages benötigt beim allerersten Aufruf ca. 1 bis 2 Minuten für die Bereitstellung.)*"
          fi
          
          gh issue comment "$ISSUE_NUMBER" --body "$COMMENT"
          gh issue close "$ISSUE_NUMBER"
